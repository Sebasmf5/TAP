name: tap

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # El contenedor inicializa el motor con superusuario interno; el script de init
      # crea el rol sin privilegios (POSTGRES_USER) que usa la aplicación.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tap}
      APP_DB_USER: ${POSTGRES_USER:-tap_app}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}
      TZ: UTC
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - tap_pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tap_app} -d ${POSTGRES_DB:-tap}']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.22
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    volumes:
      - tap_mailpit:/data
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 500

  api:
    profiles: ['full']
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:8080}
      API_HOST: 0.0.0.0
      API_PORT: 3000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      POSTGRES_USER: ${POSTGRES_USER:-tap_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tap}
      DATABASE_URL: postgres://${POSTGRES_USER:-tap_app}:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tap}
      JWT_ISSUER: ${JWT_ISSUER:-tap-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-tap-web}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?define JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?define JWT_PUBLIC_KEY}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Tap <no-reply@tap.local>}
      STORAGE_DIR: /var/lib/tap/storage
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@demo.tap}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?define SEED_ADMIN_PASSWORD}
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - tap_storage:/var/lib/tap/storage

  web:
    profiles: ['full']
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '127.0.0.1:8080:8080'

volumes:
  tap_pgdata:
    name: tap_pgdata
  tap_mailpit:
    name: tap_mailpit
  tap_storage:
    name: tap_storage
