name: Deploy to GitHub Pages

on:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    name: Compilar frontend en Modo Demostración para GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 24 LTS y Corepack
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activar pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.16.1 --activate

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar SPA con base path del repositorio y crear fallback 404.html
        run: |
          pnpm --filter @tap/web exec vite build --base="/${{ github.event.repository.name }}/"
          cp apps/web/dist/index.html apps/web/dist/404.html
          node scripts/check-bundle.ts

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
